      <ellipse cx="742" cy="628" rx="8" ry="21" transform="rotate(62 742 628)"/>
      <ellipse cx="707" cy="606" rx="8" ry="21" transform="rotate(-38 707 606)"/>
      <ellipse cx="737" cy="602" rx="8" ry="21" transform="rotate(38 737 602)"/>
