        font-size="108" font-weight="500" fill="#2B2B2B">BUILT UP <tspan fill="#B98B2E">DESIGNS</tspan></text>

  <!-- Divider lines + subtitle -->
  <line x1="125" y1="899" x2="308" y2="899" stroke="url(#gold)" stroke-width="2"/>
  <line x1="958" y1="899" x2="1143" y2="899" stroke="url(#gold)" stroke-width="2"/>
  <text x="634" y="913" text-anchor="middle" textLength="585" lengthAdjust="spacing"
